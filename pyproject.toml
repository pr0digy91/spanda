[project]
name = "spanda"
version = "0.1.0"
description = "Deterministic static-analysis indexing engine for Python codebases"
requires-python = ">=3.9"
# Deliberately zero runtime dependencies through M3, so the tool runs
# anywhere with a bare python3. networkx arrives at M6, when there is
# actually a graph to traverse.
#
# 3.9 is the floor the code needs, but that is not the version to run it on.
# A parser only understands syntax from its own release or earlier, so spanda
# must run on a Python at least as new as the newest syntax in the codebase it
# reads. Run it on the newest interpreter available; the output is identical
# across versions (verified on 3.9 and 3.14), so nothing else is affected.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spanda = "spanda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spanda"]

[tool.setuptools.package-data]
spanda = ["*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixtures/ is parsed, never imported or collected: it contains a deliberate
# syntax error and a genuine circular import.
norecursedirs = ["fixtures"]
